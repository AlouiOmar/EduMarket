openapi: 3.0.3
info:
  title: EduMarket API
  version: 1.0.0
  description: Current implemented API surface. Mongo-backed workflows require a configured database. Amounts in payment DTOs are integer minor units (cents). Errors use the stable { success false, error { code } } envelope.
servers:
  - url: http://localhost:4000/api/v1
security: []
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: edumarket_access
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ObjectId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
    Error:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, enum: [false] }
        error:
          type: object
          required: [code]
          properties:
            code: { type: string }
    EnrollmentInput:
      type: object
      required: [courseId]
      properties:
        courseId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
    QuizAnswer:
      type: object
      required: [questionId, selectedOptionIndex]
      properties:
        questionId: { type: string }
        selectedOptionIndex: { type: integer, minimum: 0 }
    QuizAttemptInput:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/QuizAnswer' }
paths:
  /health:
    get:
      summary: API health
      responses:
        '200': { description: API is available }
  /auth/register:
    post:
      summary: Register a student account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
      responses:
        '201': { description: Student account created }
        '400': { description: Invalid input }
        '409': { description: Email already registered }
        '502': { description: Email delivery failed }
        '503': { description: Email provider is not configured }
  /auth/login:
    post:
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: User DTO and HttpOnly session cookie }
        '401': { description: Invalid credentials }
        '403': { description: Email address is not verified }
  /auth/email/verification/resend:
    post:
      summary: Request an email verification link
      description: Returns a generic accepted response. Development mode may include a previewUrl; production uses the configured email provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Request accepted }
        '400': { description: Invalid input }
        '502': { description: Email delivery failed }
        '503': { description: Email provider is not configured }
  /auth/email/verification/confirm:
    post:
      summary: Confirm an email address with a one-time token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 32, maxLength: 128 }
      responses:
        '200': { description: Email verified }
        '400': { description: Invalid, expired, or already used token }
  /auth/password/forgot:
    post:
      summary: Request a password reset link
      description: Returns the same accepted response whether or not the account exists. Development mode may include a previewUrl.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Request accepted }
        '400': { description: Invalid input }
        '502': { description: Email delivery failed }
        '503': { description: Email provider is not configured }
  /auth/password/reset:
    post:
      summary: Reset a password with a one-time token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string, minLength: 32, maxLength: 128 }
                newPassword: { type: string, minLength: 10, maxLength: 128 }
      responses:
        '200': { description: Password reset and previous sessions revoked }
        '400': { description: Invalid, expired, or already used token }
  /auth/me/password:
    post:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Change password for the current account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, minLength: 10, maxLength: 128 }
                newPassword: { type: string, minLength: 10, maxLength: 128 }
      responses:
        '200': { description: Password changed and cookie renewed }
        '401': { description: Authentication or current password invalid }
  /auth/me:
    get:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Read current account
      responses:
        '200': { description: Current user DTO }
        '401': { description: Authentication required }
    patch:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Update current account profile
      responses:
        '200': { description: Updated user DTO }
        '400': { description: Invalid input }
        '401': { description: Authentication required }
  /auth/logout:
    post:
      summary: Clear browser session cookie
      responses:
        '204': { description: Session cookie cleared }
  /courses:
    get:
      summary: List published courses with search and filters
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50 } }
        - { in: query, name: search, schema: { type: string, maxLength: 100 } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: level, schema: { type: string, enum: [beginner, intermediate, advanced] } }
        - { in: query, name: price, schema: { type: string, enum: [all, free, paid] } }
        - { in: query, name: sort, schema: { type: string, enum: [popular, rating, newest, price_asc, price_desc] } }
      responses:
        '200': { description: Public course outlines and pagination }
    post:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Create a course draft
      responses:
        '201': { description: Created course }
        '401': { description: Authentication required }
        '403': { description: Role or verification requirement not met }
  /courses/categories:
    get:
      summary: List categories used by published courses
      responses:
        '200': { description: Category IDs, names, and course counts }
  /courses/mine:
    get:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: List courses owned by the current teacher/institution
      responses:
        '200': { description: Owned courses }
        '401': { description: Authentication required }
        '403': { description: Role not allowed }
  /courses/mine/{id}:
    get:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Read an editable owned course
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Editable course }
        '404': { description: Course not found or not owned }
  /courses/{id}:
    get:
      summary: Read published course outline; full lesson material requires enrollment
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Public course outline or enrolled student course content }
        '404': { description: Course not found }
    patch:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Update an owned course; publish requires admin review
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated course }
        '403': { description: Ownership or publication rule failed }
  /courses/{courseId}/lessons/{lessonId}/assets/video:
    post:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Upload or replace a private lesson video
      parameters:
        - { in: path, name: courseId, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
        - { in: path, name: lessonId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: MP4 or WebM, maximum: 262144000 }
      responses:
        '201': { description: Video asset metadata }
        '401': { description: Authentication required }
        '403': { description: Verified course staff required }
        '413': { description: Upload exceeds the size limit }
  /courses/{courseId}/lessons/{lessonId}/assets/resources:
    post:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Upload a private lesson resource
      parameters:
        - { in: path, name: courseId, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
        - { in: path, name: lessonId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: PDF or ZIP, maximum: 26214400 }
      responses:
        '201': { description: Resource asset metadata }
        '401': { description: Authentication required }
        '403': { description: Verified course staff required }
        '413': { description: Upload exceeds the size limit }
  /courses/{courseId}/assets/{assetId}:
    get:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Stream a video or download a lesson resource
      parameters:
        - { in: path, name: courseId, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
        - { in: path, name: assetId, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
      responses:
        '200': { description: Authorized private course file }
        '206': { description: Partial video response for range requests }
        '401': { description: Authentication required }
        '404': { description: Asset not found or not accessible to this account }
  /sessions/availability:
    get:
      summary: List future available tutoring slots
      parameters:
        - { in: query, name: teacherId, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Public available slots }
        '400': { description: Invalid date or teacher filter }
    post:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Publish a verified teacher's availability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startAt, endAt, type, price]
              properties:
                startAt: { type: string, format: date-time }
                endAt: { type: string, format: date-time }
                type: { type: string, enum: [online, in_person] }
                price: { type: number, minimum: 0, maximum: 100000 }
                venue: { type: string, maxLength: 200 }
      responses:
        '201': { description: Availability slot created }
        '403': { description: Verified teacher required }
        '409': { description: Availability overlaps another slot or the teacher schedule lock is busy (`SESSION_TIME_CONFLICT` or `SESSION_SCHEDULE_BUSY`) }
  /sessions:
    get:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: List sessions belonging to the current student or teacher
      responses:
        '200': { description: Participant-scoped sessions; meetingUrl is present only for configured, confirmed online meetings }
        '401': { description: Authentication required }
  /sessions/{sessionId}/book:
    post:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Book an available slot at its server-set price
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject]
              properties:
                subject: { type: string, minLength: 1, maxLength: 160 }
                notes: { type: string, maxLength: 2000 }
      responses:
        '201': { description: Booking request created }
        '409': { description: Slot is no longer available }
  /sessions/{sessionId}/status:
    patch:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Accept, reject, cancel or complete a tutoring session
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [confirmed, rejected, cancelled, completed] }
      responses:
        '200': { description: Updated session; a configured Jitsi base enables participant-scoped meetingUrl on confirmed online sessions }
        '403': { description: Role or ownership requirement not met }
  /sessions/{sessionId}/review:
    put:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Create or update a review for the student's completed session
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, comment]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        '200': { description: Saved session review }
        '403': { description: Only the student on a completed session may review }
  /enrollments:
    get:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: List current student's enrollments
      responses:
        '200': { description: Enrollments with sanitized course DTOs }
        '401': { description: Authentication required }
    post:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Enroll current student in a published free course
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollmentInput' }
      responses:
        '201': { description: Enrollment created or returned idempotently }
        '402': { description: The course is paid; paid enrollment is not available until a payment provider is configured }
        '401': { description: Authentication required }
  /enrollments/{courseId}:
    get:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Read current student's enrollment progress
      parameters:
        - { in: path, name: courseId, required: true, schema: { type: string } }
      responses:
        '200': { description: Enrollment progress }
        '404': { description: Enrollment not found }
  /enrollments/{courseId}/lessons/{lessonId}/complete:
    put:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Mark an enrolled lesson complete
      parameters:
        - { in: path, name: courseId, required: true, schema: { type: string } }
        - { in: path, name: lessonId, required: true, schema: { type: string } }
      responses:
        '200': { description: Persisted progress }
        '403': { description: Enrollment missing or required quiz not passed }
  /enrollments/{courseId}/lessons/{lessonId}/quiz-attempts:
    post:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Submit and receive server-graded quiz attempt
      parameters:
        - { in: path, name: courseId, required: true, schema: { type: string } }
        - { in: path, name: lessonId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers: { type: array, items: { $ref: '#/components/schemas/QuizAnswer' } }
      responses:
        '201': { description: Server-scored attempt and review details }
        '403': { description: Enrollment required }
        '429': { description: Attempt rate limit exceeded }
  /messaging/contacts:
    get:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Resolve one eligible student/teacher contact by email
      parameters:
        - { in: query, name: email, required: true, schema: { type: string, format: email, maxLength: 254 } }
      responses:
        '200': { description: Eligible contact identity }
        '404': { description: Contact not found or not eligible for messaging }
  /messaging/conversations:
    get:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: List conversations for the authenticated student or teacher
      responses:
        '200': { description: Caller-scoped conversations and unread counts }
        '401': { description: Authentication required }
    post:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Create or return a conversation with an eligible student/teacher contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '201': { description: Private one-to-one conversation }
        '404': { description: Contact not found or not eligible }
  /messaging/events:
    get:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Open a participant-scoped messaging Server-Sent Events stream
      responses:
        '200': { description: text/event-stream emitting `message.created` only to conversation participants }
        '401': { description: Authentication required }
        '403': { description: Student or teacher role required }
  /notifications/events:
    get:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Open an authenticated notification Server-Sent Events stream
      responses:
        '200': { description: text/event-stream emitting `notification.created` only to the owner }
        '401': { description: Authentication required }
  /notifications:
    get:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: List the current user's recent notifications
      responses:
        '200': { description: Up to 100 newest notifications belonging to the caller }
        '401': { description: Authentication required }
  /notifications/read-all:
    patch:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Mark all current user's notifications as read
      responses:
        '200': { description: Read state updated }
        '401': { description: Authentication required }
  /notifications/{notificationId}/read:
    patch:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Mark one owned notification as read
      parameters:
        - { in: path, name: notificationId, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
      responses:
        '200': { description: Notification marked read }
        '401': { description: Authentication required }
        '404': { description: Notification not found or not owned by caller }
  /messaging/conversations/{conversationId}/messages:
    get:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: List recent conversation messages and attachment metadata
      parameters:
        - { in: path, name: conversationId, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
      responses:
        '200': { description: Up to 100 messages in chronological order }
        '404': { description: Conversation not found or caller is not a participant }
    post:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Send text and/or one private document to a conversation participant
      parameters:
        - { in: path, name: conversationId, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 5000 }
          multipart/form-data:
            schema:
              type: object
              properties:
                text: { type: string, maxLength: 5000 }
                file: { type: string, format: binary, description: PDF, ZIP, or DOCX up to 10 MiB }
      responses:
        '201': { description: Message created; attachment bytes remain private }
        '400': { description: Message must contain text or a file }
        '404': { description: Conversation not found or caller is not a participant }
        '413': { description: Attachment exceeds 10 MiB }
        '415': { description: Unsupported file type or invalid file signature }
  /messaging/attachments/{attachmentId}:
    get:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Download a message attachment as one of its conversation participants
      parameters:
        - { in: path, name: attachmentId, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
      responses:
        '200': { description: Private attachment download }
        '401': { description: Authentication required }
        '404': { description: Attachment not found or caller is not a participant }
  /messaging/conversations/{conversationId}/voice-notes:
    post:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Send a private voice note to a conversation participant
      parameters:
        - { in: path, name: conversationId, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [voice, durationSeconds]
              properties:
                voice: { type: string, format: binary, description: WebM, Ogg, or MP4 audio up to 5 MiB }
                durationSeconds: { type: integer, minimum: 1, maximum: 60 }
      responses:
        '201': { description: Voice note message created; audio remains private }
        '400': { description: Voice file and duration are required }
        '401': { description: Authentication required }
        '404': { description: Conversation not found or caller is not a participant }
        '413': { description: Voice note exceeds 5 MiB }
        '415': { description: Unsupported audio type or invalid audio signature }
  /messaging/voice-notes/{voiceNoteId}:
    get:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Stream a private voice note as one of its conversation participants
      parameters:
        - { in: path, name: voiceNoteId, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
      responses:
        '200': { description: Private audio stream }
        '401': { description: Authentication required }
        '404': { description: Voice note not found or caller is not a participant }
  /messaging/conversations/{conversationId}/read:
    patch:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Mark incoming conversation messages as read
      parameters:
        - { in: path, name: conversationId, required: true, schema: { type: string } }
      responses:
        '200': { description: Read state updated }
        '404': { description: Conversation not found or caller is not a participant }
  /teacher-verifications/mine:
    get:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Read the current user's teacher application
      responses:
        '200': { description: Application DTO or null }
        '401': { description: Authentication required }
  /assignments:
    get:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: List assignments for enrolled courses
      responses:
        '200': { description: Student assignments with own submission state }
        '403': { description: Student role required }
    post:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Create an assignment for an owned published course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courseId, title, instructions, dueAt]
              properties:
                courseId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
                title: { type: string, minLength: 3, maxLength: 180 }
                instructions: { type: string, minLength: 5, maxLength: 12000 }
                dueAt: { type: string, format: date-time }
                points: { type: integer, minimum: 1, maximum: 1000 }
                status: { type: string, enum: [draft, published] }
      responses:
        '201': { description: Assignment created }
        '403': { description: Verified teacher role required }
  /assignments/teacher:
    get:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: List own assignments and student submissions
      responses:
        '200': { description: Teacher assignments and private submission metadata }
        '403': { description: Verified teacher role required }
  /assignments/{assignmentId}/submissions:
    post:
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      summary: Submit text and/or private assignment files
      parameters:
        - { in: path, name: assignmentId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answerText: { type: string, maxLength: 12000 }
          multipart/form-data:
            schema:
              type: object
              properties:
                answerText: { type: string, maxLength: 12000 }
                files:
                  type: array
                  maxItems: 3
                  items: { type: string, format: binary, description: PDF, ZIP, or DOCX up to 10 MiB each }
      responses:
        '201': { description: Assignment submission created }
        '200': { description: Submission updated before grading }
